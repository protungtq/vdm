<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src * blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Online Watch</title>
    <link rel="stylesheet" href="styles/base.css" />
    <style>
      body { background: #000; }
      video { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; outline: none; }
      .msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #ececec; text-align: center; padding: 24px; }
      .msg .t { font-size: 15px; font-weight: 700; }
      .msg .s { font-size: 12px; color: #b5b5b5; max-width: 420px; line-height: 18px; }
      .msg .row { display: flex; gap: 10px; }
      .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
  </head>
  <body>
    <video id="video" controls autoplay playsinline></video>
    <div class="loading" id="loading"><div class="spinner" style="width: 28px; height: 28px; border-width: 3px"></div></div>
    <div class="msg" id="msg" hidden>
      <div class="t">This video can’t be played here</div>
      <div class="s" id="why">The format or codec isn't supported by the built-in player (common for some MKV/HEVC files).</div>
      <div class="row">
        <button class="btn btn-primary text-only" id="external">Open in VLC / PotPlayer</button>
        <button class="btn btn-secondary text-only" id="copy">Copy link</button>
      </div>
    </div>
    <script src="../shared/i18n.js"></script>
    <script src="common.js"></script>
    <script src="player.js"></script>
  </body>
</html>
