<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>What’s new</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/themes.css" />
    <link rel="stylesheet" href="styles/dialog.css" />
    <link rel="stylesheet" href="styles/whatsnew.css" />
  </head>
  <body class="dialog whatsnew">
    <header class="titlebar">
      <img class="tb-icon" src="assets/icons/logo.svg" alt="" />
      <span class="tb-title">What’s new</span>
    </header>

    <div class="page wn-page">
      <div class="wn-head">
        <img src="assets/icons/logo.svg" alt="" />
        <div>
          <div class="wn-title" id="wnTitle"></div>
          <div class="wn-sub" id="wnSub"></div>
        </div>
      </div>
      <div class="wn-body" id="wnBody"></div>
      <div class="wn-foot">
        <button type="button" class="btn btn-outline text-only" id="wnNotes">Release notes on GitHub</button>
        <button type="button" class="btn btn-primary text-only" id="wnOk">Got it</button>
      </div>
    </div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/whats-new.js"></script>
    <script src="common.js"></script>
    <script src="whatsnew.js"></script>
  </body>
</html>
